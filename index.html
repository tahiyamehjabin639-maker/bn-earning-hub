<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BN Earning Hub</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

    <!-- আপনার Mini App-এর আগের সব HTML এখানে থাকবে -->


    <!-- API Connection -->
    <script>
    const API_URL = "https://bn-earning-hub-api.tahiyamehjabin639.workers.dev";

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    async function connectUser() {
        try {
            const user = tg.initDataUnsafe?.user;

            if (!user) {
                console.log("Telegram user not detected.");
                return;
            }

            const telegramId = String(user.id);
            const username = user.username || "";
            const firstName = user.first_name || "";
            const lastName = user.last_name || "";
            const fullName = `${firstName} ${lastName}`.trim();

            const referralCode = "BN" + telegramId;

            const referredBy =
                tg.initDataUnsafe?.start_param || null;

            const response = await fetch(`${API_URL}/api/user`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    telegram_id: telegramId,
                    username: username,
                    name: fullName,
                    referral_code: referralCode,
                    referred_by: referredBy
                })
            });

            const data = await response.json();

            console.log("BN Earning Hub User:", data);

            if (data.success) {
                localStorage.setItem(
                    "bn_user",
                    JSON.stringify(data.user)
                );

                console.log("User connected successfully.");
            }

        } catch (error) {
            console.error("API Connection Error:", error);
        }
    }

    connectUser();
    </script>

</body>
</html>
